<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#202124}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

.appbar{height:64px;background:#fff;display:flex;align-items:center;padding:0 18px;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,0.14),0 5px 14px rgba(0,0,0,0.08)}
.appbar h1{font-size:19px;margin:0 0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.appbar .status{font-size:12px;color:#777;display:flex;align-items:center;gap:6px}
.appbar .dot{width:9px;height:9px;border-radius:50%;background:#ccc}
.appbar .dot.on{background:#2e7d32}
.appbar .iconbtn{border:0;background:transparent;font-size:22px;padding:4px 6px}
.appbar .add-player-btn{border:0;background:#4527a0;color:#fff;border-radius:10px;padding:9px 12px;font-weight:bold;font-size:13px}

main{max-width:650px;margin:auto;padding:16px 16px 90px}

.card{background:#fff;border-radius:18px;margin-bottom:16px;padding:20px;box-shadow:0 2px 6px rgba(0,0,0,0.14),0 5px 14px rgba(0,0,0,0.08)}

.total{color:#fff;text-align:center;padding:24px;background:linear-gradient(135deg,#4527a0,#7e57c2);border-radius:20px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.14),0 5px 14px rgba(0,0,0,0.08)}
.total .icon{font-size:42px}
.total .label{font-size:13px;color:#ffffffbb;font-weight:bold;margin:10px}
.total .money{font-size:30px;font-weight:bold}
.total .players{color:#ffffffbb;margin-top:5px}

.hero{color:#fff;text-align:center;padding:22px;background:linear-gradient(135deg,#4527a0,#7e57c2);border-radius:20px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.14),0 5px 14px rgba(0,0,0,0.08)}
.hero .round{font-size:13px;color:#ffffffbb;font-weight:bold}
.hero .big{font-size:27px;font-weight:bold;margin:7px 0}
.hero .sub{font-size:13px;color:#ffffffcc}
.progress{display:flex;gap:4px;justify-content:center;margin-top:14px}
.progress span{height:5px;flex:1;max-width:22px;background:#ffffff55;border-radius:99px}
.progress .done,.progress .now{background:#fff}
.progress .now{box-shadow:0 0 0 2px #ffffff66}

.section-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:bold;margin-bottom:20px}
.setup-title{font-size:19px;font-weight:bold;margin:0 0 18px}

.notice{padding:20px;background:#ff98001f;border-radius:15px;text-align:center}
.info{font-size:13px;color:#555;background:#f4f4f4;border-radius:10px;padding:11px;margin:0 0 14px}

.field{margin-bottom:16px}
label{display:block;font-size:13px;margin-bottom:7px;color:#555}
input,select{width:100%;height:52px;border:1px solid #bbb;border-radius:10px;padding:0 14px;background:#fff}
.helper{font-size:12px;color:#777;margin-top:6px}

.arrow{text-align:center;font-size:26px;margin:0 0 16px}
.quick-title{font-size:13px;font-weight:bold;margin:10px 0 8px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.btn{border:0;border-radius:10px;padding:13px 8px;font-weight:bold}
.outline{background:#fff;border:1px solid #aaa}
.tonal{background:#eee8ff;color:#4527a0}
.primary{background:#4527a0;color:#fff}
.danger{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}

.complete,.full{width:100%;height:58px;margin-top:20px;font-size:16px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player-setup{display:grid;grid-template-columns:1fr 38px;gap:8px;margin-bottom:8px}
.remove{width:38px;padding:0;font-size:18px}
.team-settings{display:none;margin-top:16px;padding:14px;background:#eee8ff;border-radius:13px}
.team-settings.show{display:block}
.team-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.switch-row{display:flex;align-items:center;gap:10px;margin:7px 0 4px}
.switch-row input{height:20px;width:20px}
.switch-row label{margin:0;font-size:14px;font-weight:bold}

.summary-title{font-size:18px;font-weight:bold;margin-bottom:15px}

.player-card{padding:16px}
.player-top{display:flex;align-items:center}
.player-info{flex:1;min-width:0}
.player-name{font-weight:bold}
.balance{color:#2e7d32;font-weight:bold;margin-top:4px}
.player-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.player-manage{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.manual-row{margin-top:8px;display:flex;gap:6px}
.manual-row .btn{flex:0 0 52px;font-size:20px;padding:0}
.manual-row input{flex:1;height:46px;text-align:center}
.rename-input{width:100%;height:44px;border:1px solid #aaa;border-radius:10px;padding:0 12px;font-size:16px;font-weight:bold}
.lock{font-size:13px;color:#777}
.player-name-line{display:flex;align-items:center;gap:6px;min-width:0}
.player-name-line .player-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-mini-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}
.mini-btn{width:27px;height:27px;padding:0;border:0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.edit-mini{background:#eee8ff}
.delete-mini{background:#ffebee}
.player-compact-actions{display:flex;align-items:center;gap:3px;margin-left:auto;flex-shrink:0}
.money-mini{width:30px;height:28px;padding:0;border:0;border-radius:7px;font-size:12px;font-weight:bold}
.money-minus{background:#f4f4f4;border:1px solid #aaa}
.money-plus{background:#eee8ff}
.money-plus-strong{background:#4527a0;color:#fff}
.manual-mini{display:flex;align-items:center;gap:3px;margin-left:3px}
.manual-mini input{width:72px;height:28px;border:1px solid #bbb;border-radius:7px;padding:0 6px;font-size:11px;text-align:center}
.manual-mini button{width:28px;height:28px;padding:0;border:0;border-radius:7px;font-size:15px;font-weight:bold}

.score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.score-card{border:1px solid #e1e1e1;border-radius:14px;padding:13px;background:#fafafa}
.score-card.leading{border:2px solid #66bb6a;background:#f0fff1}
.score-name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-total{font-size:21px;font-weight:bold;margin:7px 0;color:#333}
.leading .score-total{color:#2e7d32}
.score-note{font-size:12px;color:#777;min-height:16px}
.score-entry{display:flex;gap:6px;margin-top:11px}
.score-entry input{height:42px;text-align:center;min-width:0}
.hundred{white-space:nowrap;padding:0 8px;font-size:12px;background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.entry-label{font-size:12px;color:#666;margin-top:11px}
.result{padding:16px;border-radius:13px;background:#e8f5e9;color:#1b5e20;text-align:center;font-weight:bold;font-size:16px;margin-bottom:15px}
.result small{display:block;font-weight:normal;margin-top:5px}
.history-round{border-left:4px solid #7e57c2;padding:0 0 3px 12px;margin:16px 0}
.history-round:first-child{margin-top:0}
.history-head{display:flex;justify-content:space-between;gap:8px;font-weight:bold;margin-bottom:8px}
.history-head span{font-size:12px;color:#777;font-weight:normal}
.history-lines{display:grid;gap:6px}
.history-line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.history-line b{font-weight:bold}
.negative{color:#c62828}

.nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}
.nav button{flex:1;border:0;background:#fff;color:#555;font-size:12px}
.nav button.active{color:#4527a0;font-weight:bold}
.page{display:none}
.page.active{display:block}

.players-head{display:flex;align-items:center}
.players-head>div{flex:1}
.players-head h2,.history-title{margin:0 0 5px;font-size:25px}
.players-head button{white-space:nowrap}

.empty{text-align:center;padding:40px}
.empty .big{font-size:55px}

.history-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
.history-item:last-child{border:0}
.history-main{flex:1}
.history-main b{display:block}
.history-time{font-size:12px;color:#777;margin-top:5px}
.history-amount{font-weight:bold}
.avatar{width:42px;height:42px;border-radius:50%;background:#e8defd;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}

dialog{border:0;border-radius:18px;padding:0;width:min(430px,calc(100% - 32px));box-shadow:0 10px 50px #0004}
dialog::backdrop{background:#0006}
.dialog-body{padding:22px}
.dialog-body h3{margin-top:0}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#333;color:#fff;padding:13px 18px;border-radius:10px;z-index:20;display:none;max-width:90%;text-align:center}
.toast.show{display:block}

.game-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.game-choice button{height:64px;font-size:14px}
.room-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.room-chips .btn{padding:9px 12px;font-size:13px}
.uno-table{width:100%;border-collapse:collapse;font-size:14px}

    <button id="playerAddBtn" class="add-player-btn" onclick="openPlayerDialog()" style="display:none">＋ Oyuncu</button>

    <button id="resetBtn" class="iconbtn" onclick="resetGame()" title="Oyunu sıfırla" style="display:none">↻</button>

<main>
  <section id="roomsPage" class="page active"></section>
  <section id="monopolyPosPage" class="page"></section>
  <section id="monopolyHistoryPage" class="page"></section>
  <section id="okeySetupPage" class="page"></section>
  <section id="okeyGamePage" class="page"></section>
  <section id="unoSetupPage" class="page"></section>
  <section id="unoGamePage" class="page"></section>

    <div class="field">
      <label>Şifre (opsiyonel)</label>
      <input id="roomPassword" type="password" placeholder="Boş bırakabilirsin">

<script>
const firebaseConfig = {

};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const roomsRef=db.ref('rooms');
</script>

<script>
/* =========================================================
   ORTAK DURUM
   ========================================================= */
let roomsData={};
let currentRoomKey=null;
let pendingRoomKey=null;
let pendingRoomAction=null;
let currentPage=0;
let newRoomGame='monopoly';
let roomFilter='all';
let roomSearch='';

/* Monopoly durumu */
let playersObj={}, transactionsObj={}, players=[], transactions=[];
let selectedFrom=null, selectedTo=null, amountValue='';

/* 101 Okey durumu */
let okeyData=null;

/* UNO durumu */
let unoData=null;
let unoSetupMode='high';

const connDot=document.getElementById('connDot');
const connText=document.getElementById('connText');

db.ref('.info/connected').on('value',snap=>{
  if(snap.val()===true){connDot.classList.add('on');connText.textContent='Bağlı';}
  else{connDot.classList.remove('on');connText.textContent='Bağlantı Kesildi';}
});

let lastScoreSig=null;

function scoreSig(){
  if(!currentRoomKey)return null;
  const room=roomsData[currentRoomKey];
  if(!room||!room.meta)return null;
  if(room.meta.game==='monopoly')return 'mp|'+currentRoomKey+'|'+JSON.stringify(room);
  if(room.meta.game==='uno'){
    if(!room.uno)return 'un|'+currentRoomKey+'|'+JSON.stringify(room);
    const {currentScores:_cs,...unoRest}=room.uno;
    return 'un|'+currentRoomKey+'|'+JSON.stringify({...room,uno:unoRest});
  }
  if(room.meta.game!=='okey')return null;
  if(!room.okey)return 'ok|'+currentRoomKey+'|'+JSON.stringify(room);
  const {currentScores,...okeyRest}=room.okey;
  return 'ok|'+currentRoomKey+'|'+JSON.stringify({...room,okey:okeyRest});
}

function patchScoreInputs(){
  document.querySelectorAll('.okey-score-input,.uno-score-input').forEach(inp=>{
    if(document.activeElement===inp)return;
    const v=String(inp.classList.contains('uno-score-input')?unoCurrentScore(+inp.dataset.side):okeyCurrentScore(+inp.dataset.side));
    if(inp.value!==v)inp.value=v;
  });
}

roomsRef.on('value',(snap)=>{
  roomsData=snap.val()||{};
  syncCurrentRoomState();
  const sig=scoreSig();
  if(sig!==null&&sig===lastScoreSig){patchScoreInputs();return;}
  render();
});

function syncCurrentRoomState(){
  if(currentRoomKey && !roomsData[currentRoomKey]){
    toast('Bu masa silindi.');
    currentRoomKey=null;
  }

  if(!currentRoomKey){
    playersObj={};transactionsObj={};players=[];transactions=[];
    selectedFrom=null;selectedTo=null;amountValue='';
    okeyData=null;unoData=null;
    return;
  }

  const room=roomsData[currentRoomKey]||{};
  const gameType=room.meta&&room.meta.game;

  if(gameType==='monopoly'){
    playersObj=room.players||{};
    transactionsObj=room.transactions||{};
    players=Object.keys(playersObj).sort().map(k=>({key:k,...playersObj[k]}));
    transactions=Object.keys(transactionsObj).sort().reverse().map(k=>({key:k,...transactionsObj[k]}));
    if(selectedFrom!==null && !playersObj[selectedFrom])selectedFrom=null;
    if(selectedTo!==null && !playersObj[selectedTo])selectedTo=null;
  } else if(gameType==='okey'){
    okeyData=room.okey||null;
  } else if(gameType==='uno'){
    unoData=room.uno||null;
  }
}

const fmt=n=>n.toLocaleString('tr-TR')+' ₺';
const inputFmt=n=>n.toLocaleString('tr-TR');

function toast(msg,success=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=success?'#2e7d32':'#333';
  t.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

function closeDialog(id){document.getElementById(id).close();}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function showPage(i){
  currentPage=i;
  document.querySelectorAll('.nav button').forEach((x,j)=>x.classList.toggle('active',j===i));
  render();
}

function roomRef(sub){
  return db.ref('rooms/'+currentRoomKey+(sub?('/'+sub):''));
}

/* =========================================================
   MASA (ODA) YÖNETİMİ
   ========================================================= */

function selectNewRoomGame(g){
  newRoomGame=g;
  hideRoomNameError();
  document.getElementById('gameChoiceMonopoly').className='btn '+(g==='monopoly'?'tonal':'outline');
  document.getElementById('gameChoiceOkey').className='btn '+(g==='okey'?'tonal':'outline');
  document.getElementById('gameChoiceUno').className='btn '+(g==='uno'?'tonal':'outline');
}

function openRoomDialog(){
  document.getElementById('roomName').value='';
  hideRoomNameError();
  document.getElementById('roomPassword').value='';
  selectNewRoomGame('monopoly');
  document.getElementById('roomDialog').showModal();
}

function createRoom(){
  const name=document.getElementById('roomName').value.trim();
  if(!name){toast('Masa adı gir.');return;}

  const norm=x=>String(x||'').trim().toLocaleLowerCase('tr-TR');
  const exists=Object.values(roomsData).some(r=>r&&r.meta&&(r.meta.game||'monopoly')===newRoomGame&&norm(r.meta.name)===norm(name));
  if(exists){
    const err=document.getElementById('roomNameError');
    err.textContent='Bu oyunda "'+name+'" adında bir masa zaten var. Farklı bir isim seç.';
    err.style.display='block';
    document.getElementById('roomName').focus();
    return;
  }

  const password=document.getElementById('roomPassword').value.trim();
  const newRef=roomsRef.push();

  newRef.set({
    meta:{name,password:password||null,createdAt:Date.now(),game:newRoomGame}
  });

  closeDialog('roomDialog');
  toast(name+' masası oluşturuldu.',true);
  doEnterRoom(newRef.key);
}

function enterRoom(key){
  const room=roomsData[key];
  if(!room)return;

  if(room.meta && room.meta.password){
    pendingRoomKey=key;
    pendingRoomAction='enter';
    document.getElementById('roomPasswordTitle').textContent=(room.meta.name||'Masa')+' - Şifre Gerekli';
    document.getElementById('roomPasswordInput').value='';
    document.getElementById('roomPasswordDialog').showModal();
  }else{
    doEnterRoom(key);
  }
}

function submitRoomPassword(){
  const room=roomsData[pendingRoomKey];
  if(!room){closeDialog('roomPasswordDialog');return;}

  const val=document.getElementById('roomPasswordInput').value;

  if(room.meta.password && val!==room.meta.password){
    toast('Şifre yanlış.');
    return;
  }

  closeDialog('roomPasswordDialog');

  if(pendingRoomAction==='delete')doDeleteRoom(pendingRoomKey);
  else doEnterRoom(pendingRoomKey);
}

function doEnterRoom(key){
  currentRoomKey=key;
  currentPage=0;
  amountValue='';
  selectedFrom=null;
  selectedTo=null;
  syncCurrentRoomState();
  document.querySelectorAll('.nav button').forEach((x,j)=>x.classList.toggle('active',j===0));
  render();
}

function leaveRoom(){
  currentRoomKey=null;
  syncCurrentRoomState();
  render();
}

function deleteRoom(key){
  const room=roomsData[key];
  if(!room)return;

  if(room.meta && room.meta.password){
    pendingRoomKey=key;
    pendingRoomAction='delete';
    document.getElementById('roomPasswordTitle').textContent=(room.meta.name||'Masa')+' - Silmek için şifre gir';
    document.getElementById('roomPasswordInput').value='';
    document.getElementById('roomPasswordDialog').showModal();
    return;
  }

  const name=(room.meta&&room.meta.name)||'Bu Masa';
  if(!confirm(name+' masasını silmek istiyor musun? Bu işlem geri alınamaz.'))return;

  db.ref('rooms/'+key).remove();
  if(currentRoomKey===key){currentRoomKey=null;render();}
  toast(name+' silindi.',true);
}

function doDeleteRoom(key){
  const room=roomsData[key];
  const name=(room&&room.meta&&room.meta.name)||'Bu Masa';
  if(!confirm(name+' masasını silmek istiyor musun? Bu işlem geri alınamaz.'))return;

  db.ref('rooms/'+key).remove();
  if(currentRoomKey===key){currentRoomKey=null;render();}
  toast(name+' silindi.',true);
}

function resetGame(){
  if(currentRoomKey===null)return;
  const room=roomsData[currentRoomKey];
  if(!room||!room.meta)return;

  if(room.meta.game==='monopoly'){
    if(!players.length && !transactions.length)return;
    if(!confirm('Bu masadaki tüm oyuncular ve işlem geçmişi silinecek. Emin misin?'))return;
    roomRef('players').remove();
    roomRef('transactions').remove();
    selectedFrom=null;selectedTo=null;amountValue='';
    toast('Oyun sıfırlandı.',true);
  } else if(room.meta.game==='okey'){
    if(!okeyData)return;
    if(!confirm('Bu masadaki oyun verileri silinecek ve kurulum ekranına dönülecek. Emin misin?'))return;
    roomRef('okey').remove();
    toast('Oyun sıfırlandı.',true);
  } else if(room.meta.game==='uno'){
    if(!unoData)return;
    if(!confirm('Bu masadaki oyun verileri silinecek ve kurulum ekranına dönülecek. Emin misin?'))return;
    roomRef('uno').remove();
    toast('Oyun sıfırlandı.',true);
  }
}

/* =========================================================
   GENEL GÖRÜNÜM
   ========================================================= */

function render(){
  lastScoreSig=scoreSig();
  const inRoom=currentRoomKey!==null;
  const room=inRoom?roomsData[currentRoomKey]:null;
  const gameType=room&&room.meta?room.meta.game:null;

  document.getElementById('roomsPage').classList.toggle('active',!inRoom);

  const showMonopoly=inRoom && gameType==='monopoly';
  const showOkeySetup=inRoom && gameType==='okey' && !(room.okey && room.okey.config);
  const showOkeyGame=inRoom && gameType==='okey' && !!(room.okey && room.okey.config);
  const showUnoSetup=inRoom && gameType==='uno' && !(room.uno && room.uno.config);
  const showUnoGame=inRoom && gameType==='uno' && !!(room.uno && room.uno.config);

  document.getElementById('monopolyPosPage').classList.toggle('active',showMonopoly && currentPage===0);
  document.getElementById('monopolyHistoryPage').classList.toggle('active',showMonopoly && currentPage===1);
  document.getElementById('okeySetupPage').classList.toggle('active',showOkeySetup);
  document.getElementById('okeyGamePage').classList.toggle('active',showOkeyGame);
  document.getElementById('unoSetupPage').classList.toggle('active',showUnoSetup);
  document.getElementById('unoGamePage').classList.toggle('active',showUnoGame);
  if(!showUnoSetup)document.getElementById('unoSetupPage').innerHTML='';

  document.getElementById('mainNav').style.display=showMonopoly?'flex':'none';

  if(showMonopoly){

function setRoomFilter(f){roomFilter=f;renderRoomsList();}
function onRoomSearch(v){roomSearch=v;renderRoomsList();}

function renderRoomsList(){
  const allKeys=Object.keys(roomsData);
  const q=roomSearch.trim().toLocaleLowerCase('tr-TR');
  const keys=allKeys.filter(k=>{
    const meta=(roomsData[k]&&roomsData[k].meta)||{};
    if(q)return String(meta.name||'İsimsiz Masa').toLocaleLowerCase('tr-TR').includes(q);
    return roomFilter==='all'||(meta.game||'monopoly')===roomFilter;
  });

  if(!document.getElementById('roomsListBody')){
    document.getElementById('roomsPage').innerHTML=`
      <div class="card" id="roomFilterBar">
        <input id="roomSearch" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="🔍 Masa ara..." value="${esc(roomSearch)}" oninput="onRoomSearch(this.value)">
        <div class="room-chips" id="roomChips"></div>
        <div class="helper" id="roomSearchHint" style="display:none">Arama tüm oyunlardaki masalarda yapılıyor.</div>
      </div>
      <div id="roomsListBody"></div>`;
  }
  document.getElementById('roomFilterBar').style.display=allKeys.length?'':'none';
  document.getElementById('roomSearchHint').style.display=q?'':'none';
  document.getElementById('roomChips').innerHTML=[['all','Tümü'],['monopoly','🎩 Monopoly'],['okey','🀄 101 Okey'],['uno','🃏 UNO']]
    .map(([f,l])=>`<button type="button" class="btn ${!q&&roomFilter===f?'tonal':'outline'}" onclick="setRoomFilter('${f}')">${l}</button>`).join('');

  document.getElementById('roomsListBody').innerHTML=`
    ${allKeys.length?`
    <div class="card players-head">
      <div><h2>🎲 Masalar</h2><span>${keys.length} Masa</span></div>
      <button class="btn primary" onclick="openRoomDialog()">＋ Masa Ekle</button>
    </div>`:''}

    ${keys.length?keys.map(k=>{
      const room=roomsData[k];
      const meta=room.meta||{name:'İsimsiz Masa'};
      const gameType=meta.game;
      const icon=gameType==='okey'?'🀄':(gameType==='uno'?'🃏':'🎩');
      const gameName=gameType==='okey'?'101 Okey':(gameType==='uno'?'UNO':'Monopoly');

      let subtitle='';
      if(gameType==='monopoly'){
        const plist=room.players?Object.values(room.players):[];
        const total=plist.reduce((s,p)=>s+(p.balance||0),0);
        subtitle=plist.length+'/6 oyuncu • '+fmt(total);
      } else if(gameType==='okey'){
        if(room.okey && room.okey.config){
          const sides=room.okey.config.sides||[];
          const roundsPlayed=room.okey.rounds?Object.keys(room.okey.rounds).length:0;
          const isTeam=sides.length===2&&sides[0].members.length===2;
          subtitle=(isTeam?'Eşli':'Tekli')+' • Tur '+roundsPlayed+'/'+room.okey.config.roundCount;
        }else{
          subtitle='Kurulum bekleniyor';
        }
      } else if(gameType==='uno'){
        const u=room.uno;
        if(u && u.config){
          const played=u.rounds?Object.keys(u.rounds).length:0;
          const low=u.config.mode==='low';
          subtitle=(low?'Düşük puan':'Yüksek puan')+' • '+u.config.players.length+' oyuncu • Tur '+played+(low?'/'+u.config.roundCount:'');
        }else{
          subtitle='Kurulum bekleniyor';
        }
      }

      return `
        <div class="card player-card">
          <div class="player-top">
            <div class="player-info">
              <div class="player-name" style="font-size:18px">
                ${icon} ${esc(meta.name||'İsimsiz Masa')}
                ${meta.password?'<span class="lock">🔒</span>':''}
              </div>
              <div class="balance" style="color:#777">${gameName}</div>
              <div class="balance">${subtitle}</div>
            </div>
          </div>
          <div class="player-manage">
            <button class="btn success" onclick="enterRoom('${k}')">▶️ Masaya Gir</button>
            <button class="btn danger" onclick="deleteRoom('${k}')">🗑️ Sil</button>
          </div>
        </div>`;
    }).join(''):(allKeys.length?`
      <div class="card empty">
        <div class="big">🔍</div>
        <h3>Eşleşen masa bulunamadı.</h3>
      </div>`:`

        <h3>Henüz masa yok.</h3>
        <button class="btn primary" onclick="openRoomDialog()">＋ İlk Masayı Oluştur</button>

function addPlayer(){
  if(currentRoomKey===null){toast('Önce bir masaya gir.');return;}
  if(players.length>=6){toast('En fazla 6 oyuncu ekleyebilirsin.');return;}

  const name=document.getElementById('playerName').value.trim();
  if(!name){toast('Oyuncu adı gir.');return;}

  const sn=parseInt(document.getElementById('playerStart').value.replace(/\D/g,''));
  const start=(sn>0?sn:15000)*1000;
  roomRef('players').push({name,balance:start});
  roomRef('settings/startMoney').set(start);

  document.getElementById('playerName').value='';
  closeDialog('playerDialog');
  toast(name+' eklendi.',true);
}

function openPlayerDialog(){
  if(currentRoomKey===null){toast('Önce bir masaya gir.');return;}
  if(players.length>=6){toast('En fazla 6 oyuncu ekleyebilirsin.');return;}
  document.getElementById('playerName').value='';
  document.getElementById('playerStart').value=inputFmt((((roomsData[currentRoomKey]||{}).settings||{}).startMoney||15000000)/1000);
  document.getElementById('playerDialog').showModal();
}

function removePlayer(key){
  const p=playersObj[key];
  if(!p)return;
  if(!confirm(p.name+' oyuncusunu silmek istiyor musun?'))return;

  roomRef('players').child(key).remove();
  if(selectedFrom===key)selectedFrom=null;
  if(selectedTo===key)selectedTo=null;
  toast(p.name+' silindi.',true);
}

function renamePlayer(key){
  const input=document.getElementById('renameInput_'+key);
  if(!input)return;

  const newName=input.value.trim();
  if(!newName){toast('Oyuncu adı boş olamaz.');return;}

  roomRef('players').child(key).child('name').set(newName);
  toast('Oyuncu adı "'+newName+'" olarak değiştirildi.',true);
}

function editPlayerName(key){
  const p=playersObj[key];
  if(!p)return;

  const card=document.getElementById('playerCard_'+key);
  if(!card)return;

  const playerInfo=card.querySelector('.player-info');
  playerInfo.innerHTML=`
    <input id="renameInput_${key}" class="rename-input" value="${esc(p.name)}" maxlength="30" autofocus>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button class="btn success" style="padding:8px 12px" onclick="renamePlayer('${key}')">✓ Kaydet</button>
      <button class="btn outline" style="padding:8px 12px" onclick="mp_renderPOS()">İptal</button>
    </div>
    <div class="balance">${fmt(p.balance)}</div>
  `;

  const input=document.getElementById('renameInput_'+key);
  input.focus();
  input.select();
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter')renamePlayer(key);
    if(e.key==='Escape')mp_renderPOS();
  });
}

/* =========================================================
   MONOPOLY - PARA İŞLEMLERİ
   ========================================================= */

function amountFromInput(){
  const el=document.getElementById('amount');
  if(!el)return null;

  const raw=el.value.replace(/\./g,'').replace(/,/g,'').trim();
  const n=parseInt(raw);
  return (!n||n<=0)?null:n*1000;
}

function transferMoney(){
  if(selectedFrom===null||selectedTo===null){toast('Gönderen ve alıcı oyuncuyu seç.');return;}
  if(selectedFrom===selectedTo){toast('Oyuncu kendisine para gönderemez.');return;}

  const amount=amountFromInput();
  if(!amount){toast('Geçerli bir tutar gir.');return;}

  const from=playersObj[selectedFrom];
  const to=playersObj[selectedTo];
  if(!from||!to)return;

  if(amount>from.balance){toast('Gönderen oyuncunun bakiyesi yetersiz.');return;}

  const txKey=roomRef('transactions').push().key;
  const updates={};
  updates['players/'+selectedFrom+'/balance']=from.balance-amount;
  updates['players/'+selectedTo+'/balance']=to.balance+amount;
  updates['transactions/'+txKey]={from:from.name,to:to.name,fromKey:selectedFrom,toKey:selectedTo,amount,time:Date.now()};

  roomRef().update(updates);
  amountValue='';
  toast(fmt(amount)+' transfer edildi.',true);
}

function addMoney(key,amount){
  const p=playersObj[key];
  if(!p)return;

  const txKey=roomRef('transactions').push().key;
  const updates={};
  updates['players/'+key+'/balance']=p.balance+amount;
  updates['transactions/'+txKey]={from:'Banka',to:p.name,toKey:key,amount,time:Date.now()};

  roomRef().update(updates);
  toast(p.name+' hesabına '+fmt(amount)+' eklendi.',true);
}

function removeMoney(key,amount){
  const p=playersObj[key];
  if(!p)return;

  if(p.balance<amount){toast(p.name+' oyuncusunun bakiyesi yetersiz.');return;}

  const txKey=roomRef('transactions').push().key;
  const updates={};
  updates['players/'+key+'/balance']=p.balance-amount;
  updates['transactions/'+txKey]={from:p.name,to:'Banka',fromKey:key,amount,time:Date.now()};

  roomRef().update(updates);
  toast(p.name+' hesabından '+fmt(amount)+' çıkarıldı.',true);
}

function formatManualInput(el){
  const clean=el.value.replace(/\D/g,'');
  el.value=clean?inputFmt(parseInt(clean)):'';
}

function manualApply(key,sign){
  const el=document.getElementById('manualAmount_'+key);
  if(!el)return;

  const n=parseInt(el.value.replace(/\./g,'').replace(/,/g,''));
  if(!n||n<=0){toast('Geçerli bir tutar gir.');return;}

  const amount=n*1000;
  if(sign>0)addMoney(key,amount);
  else removeMoney(key,amount);

  el.value='';
}

function formatAmountInput(el){
  const clean=el.value.replace(/\D/g,'');
  const formatted=clean?inputFmt(parseInt(clean)):'';
  el.value=formatted;
  amountValue=formatted;
}

/* =========================================================
   101 OKEY - YARDIMCI FONKSİYONLAR
   ========================================================= */

function okeyFmt(n){return new Intl.NumberFormat('tr-TR').format(n);}

function okeySides(){return (okeyData && okeyData.config && okeyData.config.sides)||[];}

function okeyIsTeamGame(){
  const s=okeySides();
  return s.length===2&&s[0].members.length===2;
}

function okeyRoundsArray(){
  const roundsObj=(okeyData&&okeyData.rounds)||{};
  return Object.keys(roundsObj).sort().map(k=>({key:k,...roundsObj[k]}));
}

function okeyPenaltiesArray(i){
  const obj=(okeyData&&okeyData.penalties&&okeyData.penalties[i])||{};
  return Object.keys(obj).sort().map(k=>({key:k,...obj[k]}));
}

function okeyPenaltyTotal(i){
  return okeyPenaltiesArray(i).reduce((s,p)=>s+p.amount,0);
}

function okeyCurrentScore(i){
  const cs=(okeyData&&okeyData.currentScores)||[];
  const v=cs[i];
  return v===undefined||v===null?'':v;
}

function okeyTotals(includeCurrent=false){
  const sides=okeySides();
  const rounds=okeyRoundsArray();
  return sides.map((_,i)=>
    rounds.reduce((s,r)=>s+(r.scores[i]||0),0)
    + okeyPenaltyTotal(i)
    + (includeCurrent?(Number(okeyCurrentScore(i))||0):0)
  );
}

function okeyLeaderInfo(includeCurrent=false){
  const t=okeyTotals(includeCurrent);
  if(t.length<2)return{totals:t,leaders:[]};
  const low=Math.min(...t);
  const leaders=t.map((x,i)=>x===low?i:-1).filter(i=>i>=0);
  return{totals:t,leaders};
}

function okey_toggleTeamSettings(){
  document.getElementById('okeyTeamSettings').classList.toggle('show',document.getElementById('okeyTeamsEnabled').checked);

function okey_createGame(){
  const names=[...document.querySelectorAll('.okeyPlayerField')].map(x=>x.value.trim());
  if(names.some(x=>!x)){toast('Tüm oyuncuların adını yazın.');return;}

  const teams=document.getElementById('okeyTeamsEnabled').checked;
  if(teams&&(!document.getElementById('okeyTeam0').value.trim()||!document.getElementById('okeyTeam1').value.trim())){
    toast('İki takım adı da gerekli.');
    return;
  }

  const sides=teams
    ?[{name:document.getElementById('okeyTeam0').value.trim(),members:names.slice(0,2)},
      {name:document.getElementById('okeyTeam1').value.trim(),members:names.slice(2,4)}]
    :names.map(name=>({name,members:[name]}));

  roomRef('okey').set({
    config:{roundCount:+document.getElementById('okeyRoundCount').value,sides},
    currentScores:sides.map(()=>''),
    rounds:{},
    penalties:{},
    finished:false
  });

  currentPage=0;
  toast('Oyun başlatıldı.',true);
}

/* =========================================================
   101 OKEY - PUANLAMA
   ========================================================= */

function setScore(i,value){
  roomRef('okey/currentScores/'+i).set(value);
}

function okeyScoreInput(i){
  return document.querySelector('.okey-score-input[data-side="'+i+'"]');
}

function okeyScoreFromDom(i){
  const el=okeyScoreInput(i);
  return el?el.value.trim():okeyCurrentScore(i);
}

function quickMinus100(i){
  const next=String((Number(okeyScoreFromDom(i))||0)-100);
  const el=okeyScoreInput(i);
  if(el)el.value=next;
  roomRef('okey/currentScores/'+i).set(next);
  toast(okeySides()[i].name+': -100 uygulandı.');
}

function addPenalty(i){
  const input=document.getElementById('penalty_'+i);
  const amount=Number(input.value);
  if(!Number.isFinite(amount)||amount===0){toast('Geçerli bir ceza puanı girin.');return;}

  roomRef('okey/penalties/'+i).push({amount,time:Date.now()});
  toast(okeySides()[i].name+' için ceza kaydedildi.',true);
}

function commitRound(){
  const sides=okeySides();
  const scores=[];

  for(let i=0;i<sides.length;i++){
    const v=okeyScoreFromDom(i);
    if(v===''){scores.push(0);continue;}
    if(!Number.isFinite(Number(v))){toast('Geçerli bir puan girin.');return;}
    scores.push(Number(v));
  }

  const roundKey=roomRef('okey/rounds').push().key;
  const updates={};
  updates['okey/rounds/'+roundKey]={scores,time:Date.now()};
  sides.forEach((_,i)=>{updates['okey/currentScores/'+i]='';});

  const newCount=okeyRoundsArray().length+1;
  if(newCount>=okeyData.config.roundCount)updates['okey/finished']=true;

  roomRef().update(updates);
  toast(newCount>=okeyData.config.roundCount?'Oyun tamamlandı. Kazanan açıklandı.':(newCount+'. tur kaydedildi.'),true);
}

function okey_renderGameBase(){
  const el=document.getElementById('okeyGamePage');
  const sides=okeySides();
  const roundsArr=okeyRoundsArray();
  const roundCount=okeyData.config.roundCount;
  const current=roundsArr.length+1;
  const isLast=current===roundCount;
  const isFinal=!!okeyData.finished;
  const info=okeyLeaderInfo(false);
  const finalInfo=okeyLeaderInfo(false);

  let result='';
  if(isFinal){
    const min=Math.min(...finalInfo.totals), winners=finalInfo.leaders;
    const max=Math.max(...finalInfo.totals), diff=max-min;
    result=`<div class="result">${winners.length>1?'🤝 Berabere tamamlandı!':`🏆 Kazanan: ${esc(sides[winners[0]].name)}`}<small>${diff?`${okeyIsTeamGame()?'Aradaki fark':'En yüksek skorla fark'}: ${okeyFmt(diff)} puan`:'Tüm taraflar aynı puanda.'}</small></div>`;
  }else if(isLast&&roundsArr.length){
    const low=Math.min(...info.totals),leaders=info.leaders,max=Math.max(...info.totals),diff=max-low;
    result=`<div class="info">Son tura giriliyor. ${leaders.length===1?`<b>${esc(sides[leaders[0]].name)}</b> yeşil gösterilir ve ${okeyFmt(diff)} puan öndedir.`:'Puanlar şu an eşit.'}</div>`;
  }

  const displayTotals=isFinal?finalInfo.totals:info.totals;

  el.innerHTML=`
    <div class="hero">
      <div class="round">${isFinal?'OYUN TAMAMLANDI':`TUR ${current} / ${roundCount}`}</div>
      <div class="big">${isFinal?'Sonuçlar hazır':'101 Okey Skor'}</div>
      <div class="sub">${sides.length===2&&sides[0].members.length===2?'Takımlı oyun':'Bireysel oyun'}</div>
      <div class="progress">${Array.from({length:roundCount},(_,i)=>`<span class="${i<roundsArr.length?'done':(i===roundsArr.length&&!isFinal?'now':'')}"></span>`).join('')}</div>
    </div>
    ${result}
    <div class="card">
      <h2 class="section-title">${isFinal?'Nihai Puanlar':`Tur ${current} Puanları`}</h2>
      ${!isFinal?'<p class="info">Puanlar yalnızca bu tur içindir. <b>−100</b> hızlı butonu, seçilen tarafa bu tur için −100 puan yazar.</p>':''}
      <div class="score-grid">
        ${sides.map((side,i)=>{
          const lead=(isFinal?finalInfo:info).leaders.includes(i);
          const currentScore=okeyCurrentScore(i);
          return `
            <div class="score-card ${lead&&displayTotals.some(x=>x!==displayTotals[i])?'leading':''}">
              <div class="score-name">${esc(side.name)}</div>
              <div class="score-note">${side.members.length>1?esc(side.members.join(' + ')):''}</div>
              <div class="score-total">${okeyFmt(displayTotals[i])}</div>
              <div class="score-note">${isFinal?'toplam puan':(roundsArr.length?`Önceki turlar: ${okeyFmt(info.totals[i])}`:'Başlangıç puanı: 0')}</div>
              ${!isFinal?`
                <div class="entry-label">Bu tur puanı</div>
                <div class="score-entry">
                  <input class="okey-score-input" data-side="${i}" type="number" inputmode="decimal" value="${esc(currentScore)}" placeholder="0" onchange="setScore(${i},this.value)">
                  <button class="btn hundred" onclick="quickMinus100(${i})">−100</button>
                </div>`:''}
            </div>`;
        }).join('')}
      </div>
      ${!isFinal?`<button class="btn primary full" style="margin-top:18px" onclick="commitRound()">${isLast?'SON TURU BİTİR VE KAZANANI GÖSTER':'TURU KAYDET'}</button>`:''}
    </div>
  `;
}

function okey_renderGame(){
  okey_renderGameBase();

  const el=document.getElementById('okeyGamePage');
  const sides=okeySides();
  const roundsArr=okeyRoundsArray();
  const roundCount=okeyData.config.roundCount;
  const isFinal=!!okeyData.finished;

  const showPreFinal=roundsArr.length+1===roundCount||isFinal;

  if(!showPreFinal)el.querySelectorAll('.score-card').forEach(card=>{
    const total=card.querySelector('.score-total');
    const note=total&&total.nextElementSibling;
    if(total)total.textContent='—';
    if(note)note.textContent='Toplamlar son turda gösterilir.';
  });

  if(showPreFinal&&!isFinal){
    el.querySelectorAll('.info').forEach(note=>{if(note.textContent.includes('Son tura giriliyor'))note.remove();});

    const currentTotals=okeyTotals(false), lowest=Math.min(...currentTotals), highest=Math.max(...currentTotals), difference=highest-lowest;
    const leaders=currentTotals.map((score,i)=>score===lowest?i:-1).filter(i=>i>=0);
    const differenceHtml=`
      <div class="card" style="border:2px solid #d9c8ff">
        <h2 class="section-title">📊 Son Turdan Önceki Farklar</h2>
        <div class="history-lines">
          ${[...sides.keys()].sort((a,b)=>currentTotals[a]-currentTotals[b]).map((i,rank)=>{
            const side=sides[i], gap=currentTotals[i]-lowest;
            return `<div class="history-line"><span>${rank+1}. ${esc(side.name)} ${leaders.includes(i)&&difference?'🟢':''}</span><b style="${leaders.includes(i)&&difference?'color:#2e7d32':''}">${okeyFmt(currentTotals[i])}${gap?` <small style="color:#777;font-weight:normal">(+${okeyFmt(gap)} fark)</small>`:' <small style="color:#2e7d32;font-weight:normal">(en düşük)</small>'}</b></div>`;
          }).join('')}
        </div>
        <div class="result" style="margin:14px 0 0">${difference?(leaders.length===1?`${esc(sides[leaders[0]].name)} önde`:'Puanlar eşit')+' · '+(okeyIsTeamGame()?'Aradaki fark':'En yüksek fark')+': '+okeyFmt(difference)+' puan':'Puanlar eşit · Fark: 0 puan'}</div>
      </div>`;
    el.querySelector('.hero').insertAdjacentHTML('afterend',differenceHtml);
  }

  if(!isFinal&&roundsArr.length+1!==roundCount)el.querySelectorAll('.score-card.leading').forEach(card=>card.classList.remove('leading'));

  el.insertAdjacentHTML('beforeend',`
    <div class="card">
      <h2 class="section-title">⚠️ Ceza Tablosu</h2>
      <p class="info">Her kişi veya takım için sınırsız ceza girebilirsiniz. Ceza puanı genel toplama eklenir.</p>
      <div class="score-grid">
        ${sides.map((side,i)=>`
          <div class="score-card">
            <div class="score-name">${esc(side.name)}</div>
            <div class="score-note">Toplam ceza: ${okeyFmt(okeyPenaltyTotal(i))}</div>
            <div class="score-entry">
              <input id="penalty_${i}" type="number" inputmode="numeric" placeholder="Ceza puanı">
              <button class="btn tonal" onclick="addPenalty(${i})">Ekle</button>
            </div>
            <div class="score-note" style="margin-top:9px">${okeyPenaltiesArray(i).length?okeyPenaltiesArray(i).map(p=>`${p.amount>0?'+':''}${okeyFmt(p.amount)}`).join(' • '):'Henüz ceza yok.'}</div>
            ${okeyPenaltiesArray(i).length?`<button class="btn outline" style="margin-top:8px;padding:7px 10px;font-size:12px" onclick="okeyUndoPenalty(${i})">↩️ Son cezayı sil</button>`:''}
          </div>`).join('')}
      </div>
    </div>`);

  if(roundsArr.length)el.insertAdjacentHTML('beforeend',`
    <div class="card">
      <h2 class="section-title">🧾 Önceki Turlar</h2>
      <div style="overflow-x:auto">
        <table class="uno-table">
          <thead><tr><th></th>${sides.map(side=>`<th>${esc(side.name)}</th>`).join('')}</tr></thead>
          <tbody>${roundsArr.map((round,index)=>`<tr><td>Tur ${index+1}</td>${sides.map((side,i)=>`<td class="${round.scores[i]<0?'negative':''}">${okeyFmt(round.scores[i])}</td>`).join('')}</tr>`).join('')}${showPreFinal?`<tr class="tot"><td>Toplam</td>${okeyTotals(false).map((t,i)=>{const pen=okeyPenaltyTotal(i);return `<td>${okeyFmt(t)}${pen?`<br><small>(${pen>0?'+':''}${okeyFmt(pen)} ceza)</small>`:''}</td>`;}).join('')}</tr>`:''}</tbody>
        </table>
      </div>
    </div>`);

  el.insertAdjacentHTML('beforeend',okey_toolsHtml());
}

/* =========================================================
   UNO
   ========================================================= */

const unoFmt=n=>new Intl.NumberFormat('tr-TR').format(n);
function unoPlayers(){return (unoData&&unoData.config&&unoData.config.players)||[];}
function unoRoundsArray(){
  const o=(unoData&&unoData.rounds)||{};
  return Object.keys(o).sort().map(k=>({key:k,...o[k]}));
}
function unoCurrentScore(i){
  const cs=(unoData&&unoData.currentScores)||[];
  const v=cs[i];
  return v===undefined||v===null?'':v;
}
function unoTotals(){
  const rounds=unoRoundsArray();
  return unoPlayers().map((_,i)=>rounds.reduce((s,r)=>s+((r.scores&&r.scores[i])||0),0));
}
function unoRanks(scores){
  const low=!!(unoData&&unoData.config&&unoData.config.mode==='low');
  return scores.map(s=>1+scores.filter(x=>low?x<s:x>s).length);
}
function unoSetScore(i,v){roomRef('uno/currentScores/'+i).set(v);}
function unoScoreFromDom(i){
  const el=document.querySelector('.uno-score-input[data-side="'+i+'"]');
  return el?el.value.trim():unoCurrentScore(i);
}

function uno_setMode(m){
  unoSetupMode=m;
  document.getElementById('unoModeHigh').className='btn '+(m==='high'?'tonal':'outline');
  document.getElementById('unoModeLow').className='btn '+(m==='low'?'tonal':'outline');
  document.getElementById('unoHighBox').style.display=m==='high'?'':'none';
  document.getElementById('unoLowBox').style.display=m==='low'?'':'none';
}

function uno_renderSetup(){
  document.getElementById('unoSetupPage').innerHTML=`
    <div class="card"><h2 class="setup-title">🃏 UNO Kurulumu</h2>
      <div class="field">
        <label>Oyun şekli</label>
        <div class="game-choice" style="grid-template-columns:1fr 1fr">
          <button type="button" id="unoModeHigh" class="btn outline" onclick="uno_setMode('high')">⬆️<br>YÜKSEK PUAN</button>
          <button type="button" id="unoModeLow" class="btn outline" onclick="uno_setMode('low')">⬇️<br>DÜŞÜK PUAN</button>
        </div>
      </div>
      <div id="unoHighBox" class="field">
        <label>Hedef puan</label>
        <input id="unoTarget" type="number" inputmode="numeric" value="500">
        <div class="helper">Hedef puana ilk ulaşan oyuncu kazanır.</div>
      </div>
      <div id="unoLowBox" class="field">
        <label>Tur sayısı</label>
        <select id="unoRoundCount">${Array.from({length:20},(_,i)=>`<option value="${i+1}" ${i===4?'selected':''}>${i+1} tur</option>`).join('')}</select>
        <div class="helper">Tur sayısı bitince en düşük puanlı oyuncu kazanır.</div>
      </div>
      <div class="field">
        <label>Oyuncu sayısı</label>
        <select id="unoPlayerCount" onchange="uno_drawPlayerFields()">${Array.from({length:9},(_,i)=>`<option value="${i+2}" ${i+2===4?'selected':''}>${i+2} oyuncu</option>`).join('')}</select>
      </div>
      <div id="unoPlayerFields"></div>
      <button class="btn primary full" style="margin-top:20px" onclick="uno_createGame()">OYUNU BAŞLAT</button>
    </div>`;
  uno_drawPlayerFields(true);
  uno_setMode(unoSetupMode);
}

function uno_drawPlayerFields(fresh){
  const old=fresh?[]:[...document.querySelectorAll('.unoPlayerField')].map(x=>x.value);
  const tag=Date.now();
  const n=+document.getElementById('unoPlayerCount').value;
  document.getElementById('unoPlayerFields').innerHTML=`
    <label>Oyuncu adları</label>
    ${Array.from({length:n},(_,i)=>`
      <div class="player-setup">
        <input class="unoPlayerField" name="uno_${tag}_${i}" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" maxlength="30" placeholder="Oyuncu ${i+1}" value="${esc(old[i]||'')}">
        <span></span>
      </div>`).join('')}`;
}

function uno_createGame(){
  const names=[...document.querySelectorAll('.unoPlayerField')].map(x=>x.value.trim());
  if(names.some(x=>!x)){toast('Tüm oyuncuların adını yazın.');return;}
  const cfg={mode:unoSetupMode,players:names};
  if(unoSetupMode==='low'){
    cfg.roundCount=+document.getElementById('unoRoundCount').value;
  }else{
    const t=parseInt(document.getElementById('unoTarget').value);
    if(!t||t<=0){toast('Geçerli bir hedef puan girin.');return;}
    cfg.target=t;
  }
  roomRef('uno').set({config:cfg,currentScores:names.map(()=>''),rounds:{},finished:false});
  toast('Oyun başlatıldı.',true);
}

function uno_commitRound(){
  const names=unoPlayers(), cfg=unoData.config;
  const scores=[];
  for(let i=0;i<names.length;i++){
    const v=unoScoreFromDom(i);
    if(v===''){scores.push(0);continue;}
    if(!Number.isFinite(Number(v))){toast('Geçerli bir puan girin.');return;}
    scores.push(Number(v));
  }
  const roundKey=roomRef('uno/rounds').push().key;
  const updates={};
  updates['uno/rounds/'+roundKey]={scores,time:Date.now()};
  names.forEach((_,i)=>{updates['uno/currentScores/'+i]='';});
  const count=unoRoundsArray().length+1;
  const totals=unoTotals().map((t,i)=>t+scores[i]);
  const done=cfg.mode==='low'?count>=cfg.roundCount:totals.some(t=>t>=cfg.target);
  if(done)updates['uno/finished']=true;
  roomRef().update(updates);
  toast(done?'Oyun tamamlandı.':(count+'. tur kaydedildi.'),true);
}

function uno_renderGame(){
  const el=document.getElementById('unoGamePage');
  const names=unoPlayers(), cfg=unoData.config, low=cfg.mode==='low';
  const rounds=unoRoundsArray(), totals=unoTotals(), done=!!unoData.finished;
  const current=rounds.length+1;
  const best=low?Math.min(...totals):Math.max(...totals);
  const leaders=totals.map((t,i)=>t===best?i:-1).filter(i=>i>=0);
  const allSame=totals.every(t=>t===totals[0]);
  const last=rounds.length?rounds[rounds.length-1]:null;
  const lastSc=last?names.map((_,i)=>(last.scores&&last.scores[i])||0):[];
  const lastRk=unoRanks(totals);
  const isLast=low&&current===cfg.roundCount;
  const time=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});

  el.innerHTML=`
    <div class="hero">
      <div class="round">${done?'OYUN TAMAMLANDI':(low?`TUR ${current} / ${cfg.roundCount}`:`TUR ${current}`)}</div>
      <div class="big">${done?'Sonuçlar hazır':'UNO Skor'}</div>
      <div class="sub">${low?'Düşük puan kazanır':'Yüksek puan kazanır • Hedef '+unoFmt(cfg.target)}</div>
      ${low?`<div class="progress">${Array.from({length:cfg.roundCount},(_,i)=>`<span class="${i<rounds.length?'done':(i===rounds.length&&!done?'now':'')}"></span>`).join('')}</div>`:''}
    </div>
    ${done?`<div class="result">${leaders.length>1?'🤝 Berabere tamamlandı!':`🏆 Kazanan: ${esc(names[leaders[0]])}`}<small>${leaders.length>1?leaders.map(i=>esc(names[i])).join(' & ')+' • ':''}${unoFmt(best)} puan</small></div>`:''}
    <div class="card">
      <h2 class="section-title">${done?'Nihai Puanlar':`Tur ${current} Puanları`}</h2>
      <div class="score-grid">
        ${names.map((name,i)=>`
          <div class="score-card ${!allSame&&leaders.includes(i)?'leading':''}">
            <div class="score-name">${esc(name)}</div>
            <div class="score-note">Toplam puan</div>
            <div class="score-total">${unoFmt(totals[i])}</div>
            <div class="score-note">${last?`Önceki tur: ${unoFmt(lastSc[i])} (${lastRk[i]}.)`:'Henüz tur oynanmadı'}</div>
            ${!done?`
              <div class="entry-label">Bu tur puanı</div>
              <div class="score-entry">
                <input class="uno-score-input" data-side="${i}" type="number" inputmode="decimal" value="${esc(unoCurrentScore(i))}" placeholder="0" onchange="unoSetScore(${i},this.value)">
              </div>`:''}
          </div>`).join('')}
      </div>
      ${!done?`<button class="btn primary full" style="margin-top:18px" onclick="uno_commitRound()">${isLast?'SON TURU BİTİR VE KAZANANI GÖSTER':'TURU KAYDET'}</button>`:''}
    </div>
    ${rounds.length?`
    <div class="card">
      <h2 class="section-title">🧾 Turlar</h2>
      <div style="overflow-x:auto">
        <table class="uno-table">
          <thead><tr><th></th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead>
          <tbody>
            ${rounds.map((r,ri)=>{
              const sc=names.map((_,i)=>(r.scores&&r.scores[i])||0);
              return `<tr><td>${ri+1}. tur</td>${names.map((n,i)=>`<td class="${sc[i]<0?'negative':''}">${unoFmt(sc[i])}</td>`).join('')}</tr>`;
            }).join('')}
            <tr class="tot"><td>Toplam</td>${names.map((n,i)=>`<td>${unoFmt(totals[i])} <small>(${lastRk[i]}.)</small></td>`).join('')}</tr>
          </tbody>
        </table>
      </div>
    </div>`:''}
  `;
  el.insertAdjacentHTML('beforeend',uno_toolsHtml());
}

/* =========================================================

/* Monopoly */
function mp_toolsHtml(){
  const active=players.filter(p=>!p.out);
  const win=players.length>=2&&active.length===1?`<div class="result">🏆 Kazanan: ${esc(active[0].name)}</div>`:'';
  if(!transactions.length)return win;
  return `${win}<button class="btn outline full" style="margin-bottom:16px" onclick="mp_undoLast()">↩️ Son işlemi geri al</button>`;
}

function mp_undoLast(){
  const t=transactions[0];
  if(!t){toast('Geri alınacak işlem yok.');return;}
  const byName=n=>{const m=players.filter(p=>p.name===n);return m.length===1?m[0].key:null;};
  const fk=t.from==='Banka'?null:(t.fromKey||byName(t.from));
  const tk=t.to==='Banka'?null:(t.toKey||byName(t.to));
  const f=fk&&playersObj[fk], r=tk&&playersObj[tk];
  if((t.from!=='Banka'&&!f)||(t.to!=='Banka'&&!r)){toast('Oyuncu bulunamadığı için geri alınamıyor.');return;}
  if(r&&r.balance<t.amount){toast(r.name+' bakiyesi yetersiz, geri alınamıyor.');return;}
  if(!confirm(t.from+' → '+t.to+' ('+fmt(t.amount)+') işlemi geri alınsın mı?'))return;
  const u={};
  if(f)u['players/'+fk+'/balance']=f.balance+t.amount;
  if(r)u['players/'+tk+'/balance']=r.balance-t.amount;
  u['transactions/'+t.key]=null;
  roomRef().update(u);
  toast('İşlem geri alındı.',true);
}

function toggleOut(key){
  const p=playersObj[key];
  if(!p)return;
  if(!p.out&&!confirm(p.name+' elendi (iflas) olarak işaretlensin mi?'))return;
  roomRef('players/'+key+'/out').set(p.out?null:true);
  if(selectedFrom===key)selectedFrom=null;
  if(selectedTo===key)selectedTo=null;
  toast(p.out?p.name+' oyuna geri alındı.':p.name+' elendi.',true);
}

/* 101 Okey */
function okey_toolsHtml(){
  if(!okeyRoundsArray().length)return '';
  return `<button class="btn outline full" style="margin-bottom:16px" onclick="okey_undoRound()">↩️ Son turu geri al</button>`;
}

function okey_undoRound(){
  const r=okeyRoundsArray();
  if(!r.length){toast('Geri alınacak tur yok.');return;}
  const last=r[r.length-1];
  if(!confirm('Tur '+r.length+' geri alınsın mı? Puanlar kutulara geri yazılır, düzeltip tekrar kaydedebilirsin.'))return;
  const u={};
  u['okey/rounds/'+last.key]=null;
  okeySides().forEach((_,i)=>{u['okey/currentScores/'+i]=String(last.scores[i]??'');});
  u['okey/finished']=false;
  roomRef().update(u);
  toast('Son tur geri alındı.',true);
}

function okeyUndoPenalty(i){
  const a=okeyPenaltiesArray(i);
  if(!a.length)return;
  const l=a[a.length-1];
  if(!confirm(okeySides()[i].name+' için son ceza ('+l.amount+') silinsin mi?'))return;
  roomRef('okey/penalties/'+i+'/'+l.key).remove();
  toast('Ceza silindi.',true);
}

/* UNO */
function uno_toolsHtml(){
  if(!unoRoundsArray().length)return '';
  return `<button class="btn outline full" style="margin-bottom:16px" onclick="uno_undoRound()">↩️ Son turu geri al</button>`;
}

function uno_undoRound(){
  const r=unoRoundsArray();
  if(!r.length){toast('Geri alınacak tur yok.');return;}
  const last=r[r.length-1];
  if(!confirm(r.length+'. tur geri alınsın mı? Puanlar kutulara geri yazılır, düzeltip tekrar kaydedebilirsin.'))return;
  const u={};
  u['uno/rounds/'+last.key]=null;
  unoPlayers().forEach((_,i)=>{u['uno/currentScores/'+i]=String((last.scores&&last.scores[i])??'');});

  roomRef().update(u);
  toast('Son tur geri alındı.',true);
}
